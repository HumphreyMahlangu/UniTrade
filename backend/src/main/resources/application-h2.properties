# Optional quick-start profile: runs WITHOUT MySQL, using an H2 database file in backend/data/.
# Start with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# MySQL remains the main database; this exists so the app can still be run if MySQL is unavailable.
spring.datasource.url=jdbc:h2:file:./data/unitrade-h2;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
