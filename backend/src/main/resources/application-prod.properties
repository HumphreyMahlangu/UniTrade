# Settings for the deployed API (Render sets SPRING_PROFILES_ACTIVE=prod).
#
# Rule: only SECRETS come from Render's environment variables, and they are set once:
#   DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET
# Every other deployed setting lives here, in git. To change one, edit this file and push:
# Render redeploys automatically, so nobody needs access to the Render dashboard.

# Database: required in production (no localhost fallback), so a missing value fails clearly at start-up.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Free hosting tiers allow only a few database connections; 5 is plenty for this app.
spring.datasource.hikari.maximum-pool-size=5

# The deployed frontend (Vercel) that may call this API. Comma-separate several addresses, no trailing slash.
app.cors.allowed-origins=https://uni-trade-eight.vercel.app

# Signing key for login tokens (used from Slice 1 on). Any long random string; required in production.
app.jwt.secret=${JWT_SECRET}
