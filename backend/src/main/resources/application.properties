spring.application.name=unitrade

# Render (and similar hosts) tell the app which port to use via PORT; locally 8080.
server.port=${PORT:8080}

# Local, git-ignored overrides (DB password etc.). Copy application-local.properties.example.
# Path is relative to the folder you start the backend from (backend/).
spring.config.import=optional:file:./application-local.properties

# ---------- Database (MySQL 8) ----------
# Values come from environment variables, or from application-local.properties.
# No passwords are stored in git.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/unitrade?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:unitrade}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates/updates tables from the @Entity classes (simple; fine for this project).
spring.jpa.hibernate.ddl-auto=update
# Close the DB session when the service method ends (avoids hidden lazy-loading queries in controllers).
spring.jpa.open-in-view=false

# ---------- CORS ----------
# Comma-separated list of browser origins allowed to call /api (add the Vercel URL when deployed).
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173}
